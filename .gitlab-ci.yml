stages:
  - test
  - build
  - deploy

variables:
  PIP_NO_CACHE_DIR: "1"
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  LOCAL_IMAGE_NAME: merchant-inference-service
  DEPLOY_CONTAINER_NAME: merchant-inference-service
  DEPLOY_PORT_MAP: 8000:8000

test:
  stage: test
  before_script:
    - docker info >/dev/null
  script:
    - >
      docker run --rm
      --user "$(id -u):$(id -g)"
      -e HOME=/tmp/runner-home
      -v "$CI_PROJECT_DIR:/workspace:ro"
      -w /tmp
      python:3.12.7-slim
      sh -lc "mkdir -p \"$HOME\" /tmp/project &&
      cp -R /workspace/AI /tmp/project/AI &&
      cd /tmp/project/AI &&
      python -m pip install --no-cache-dir --user uv &&
      export PATH=\"$HOME/.local/bin:$PATH\" &&
      uv sync --frozen --extra dev &&
      .venv/bin/python -m pytest -q"
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev/ai"'
      when: always
    - when: never

docker-build:
  stage: build
  needs:
    - test
  before_script:
    - docker info >/dev/null
  script:
    - docker build --pull -f AI/Dockerfile -t "$LOCAL_IMAGE_NAME:$IMAGE_TAG" -t "$LOCAL_IMAGE_NAME:latest" AI
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev/ai"'
      when: always
    - when: never

deploy:
  stage: deploy
  needs:
    - docker-build
  before_script:
    - docker info >/dev/null
    - test -f "$DEPLOY_ENV_FILE"
  script:
    - docker rm -f "$DEPLOY_CONTAINER_NAME" || true
    - >
      docker run -d
      --name "$DEPLOY_CONTAINER_NAME"
      --restart unless-stopped
      --env-file "$DEPLOY_ENV_FILE"
      -p "$DEPLOY_PORT_MAP"
      "$LOCAL_IMAGE_NAME:$IMAGE_TAG"
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev/ai"'
      when: always
    - when: never
