stages:
  - build
  - deploy

default:
  hooks:
    pre_get_sources_script:
      - if [ -d "$CI_PROJECT_DIR" ]; then sudo -n chown -R "$(id -u):$(id -g)" "$CI_PROJECT_DIR"; fi
      - if [ -d "$CI_PROJECT_DIR/AI" ]; then sudo -n find "$CI_PROJECT_DIR/AI" -type d \( -name ".venv" -o -name "__pycache__" -o -name "*.egg-info" \) -prune -exec rm -rf {} +; fi

variables:
  PIP_NO_CACHE_DIR: "1"
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  LOCAL_IMAGE_NAME: merchant-inference-service
  DEPLOY_CONTAINER_NAME: merchant-inference-service
  DEPLOY_PORT_MAP: 8000:8000

docker-build:
  stage: build
  before_script:
    - docker info >/dev/null
  script:
    - docker build --pull -f AI/Dockerfile -t "$LOCAL_IMAGE_NAME:$IMAGE_TAG" -t "$LOCAL_IMAGE_NAME:latest" AI
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev/ai"'
      when: always
    - when: never

deploy:
  stage: deploy
  needs:
    - docker-build
  before_script:
    - docker info >/dev/null
    - test -f "$DEPLOY_ENV_FILE"
  script:
    - docker rm -f "$DEPLOY_CONTAINER_NAME" || true
    - >
      docker run -d
      --name "$DEPLOY_CONTAINER_NAME"
      --restart unless-stopped
      --env-file "$DEPLOY_ENV_FILE"
      -p "$DEPLOY_PORT_MAP"
      "$LOCAL_IMAGE_NAME:$IMAGE_TAG"
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev/ai"'
      when: always
    - when: never
