services:
  amagetdone-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amagetdone-backend
    ports:
      - "127.0.0.1:${COMPOSE_HOST_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://amagetdone-postgres:5432/${POSTGRES_DB}
      REDIS_HOST: amagetdone-redis
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      - amagetdone-postgres
      - amagetdone-redis
    restart: unless-stopped

  amagetdone-postgres:
    image: postgres:16-alpine
    container_name: amagetdone-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  amagetdone-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: amagetdone-pgadmin
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "8108:80"
    depends_on:
      - amagetdone-postgres
    restart: unless-stopped

  amagetdone-redis:
    image: redis:7-alpine
    container_name: amagetdone-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
