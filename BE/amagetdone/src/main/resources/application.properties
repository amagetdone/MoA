spring.application.name=amagetdone
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-seconds=${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
jwt.refresh-token-expiration-seconds=${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

social.auth.google.token-info-uri=${GOOGLE_TOKEN_INFO_URI:https://oauth2.googleapis.com/tokeninfo}
social.auth.kakao.user-info-uri=${KAKAO_USER_INFO_URI:https://kapi.kakao.com/v2/user/me}

asset.ssafy.base-url=${ASSET_SSAFY_BASE_URL:https://finopenapi.ssafy.io/ssafy/api/v1/edu}
asset.ssafy.institution-code=${ASSET_SSAFY_INSTITUTION_CODE:00100}
asset.ssafy.fintech-app-no=${ASSET_SSAFY_FINTECH_APP_NO:001}
asset.ssafy.api-key=${SSAFY_FIN_API_KEY:}

transaction.ssafy.base-url=${TRANSACTION_SSAFY_BASE_URL:https://finopenapi.ssafy.io/ssafy/api/v1/edu}
transaction.ssafy.institution-code=${TRANSACTION_SSAFY_INSTITUTION_CODE:00100}
transaction.ssafy.fintech-app-no=${TRANSACTION_SSAFY_FINTECH_APP_NO:001}
transaction.ssafy.api-key=${SSAFY_FIN_API_KEY:}
