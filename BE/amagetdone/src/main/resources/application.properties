spring.application.name=amagetdone
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api
server.forward-headers-strategy=framework
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
app.external-base-url=${APP_EXTERNAL_BASE_URL:}
app.cors.allowed-origins=http://localhost:8080,http://localhost:3000,http://localhost:5173,https://j14d101.p.ssafy.io
springdoc.use-fqn=true

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-seconds=${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
jwt.refresh-token-expiration-seconds=${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

social.auth.google.client-id=${GOOGLE_CLIENT_ID}
social.auth.google.token-info-uri=${GOOGLE_TOKEN_INFO_URI:https://oauth2.googleapis.com/tokeninfo}
social.auth.kakao.user-info-uri=${KAKAO_USER_INFO_URI:https://kapi.kakao.com/v2/user/me}
spring.messages.encoding=UTF-8
ssafy.fin-api.base-url=${SSAFY_FIN_BASE_URL:https://finopenapi.ssafy.io/ssafy/api/v1}
ssafy.fin-api.api-key=${SSAFY_FIN_API_KEY:}

account.ssafy.base-url=${ACCOUNT_SSAFY_BASE_URL:${ASSET_SSAFY_BASE_URL:https://finopenapi.ssafy.io/ssafy/api/v1/edu}}
account.ssafy.institution-code=${ACCOUNT_SSAFY_INSTITUTION_CODE:${ASSET_SSAFY_INSTITUTION_CODE:00100}}
account.ssafy.fintech-app-no=${ACCOUNT_SSAFY_FINTECH_APP_NO:${ASSET_SSAFY_FINTECH_APP_NO:001}}
account.ssafy.api-key=${ACCOUNT_SSAFY_API_KEY:${SSAFY_FIN_API_KEY:}}

transaction.ssafy.base-url=${TRANSACTION_SSAFY_BASE_URL:https://finopenapi.ssafy.io/ssafy/api/v1/edu}
transaction.ssafy.institution-code=${TRANSACTION_SSAFY_INSTITUTION_CODE:00100}
transaction.ssafy.fintech-app-no=${TRANSACTION_SSAFY_FINTECH_APP_NO:001}
transaction.ssafy.api-key=${SSAFY_FIN_API_KEY:}
transaction.merchant-inference.base-url=${TRANSACTION_MERCHANT_INFERENCE_BASE_URL:}
transaction.analysis-response-mode=real

test.social-user.nickname=${TEST_SOCIAL_USER_NICKNAME:tester}
test.social-user.email=${TEST_SOCIAL_USER_EMAIL:test@test.com}
test.social-user.user-api-key=${TEST_SOCIAL_USER_API_KEY:}

cloud.aws.credentials.access-key=${AWS_ACCESS_KEY:}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY:}
cloud.aws.region.static-region=${AWS_REGION:ap-northeast-2}
cloud.aws.s3.bucket=${AWS_S3_BUCKET:}

plan-ai.base-url=${PLAN_AI_BASE_URL:}
plan-ai.generate-path=${PLAN_AI_GENERATE_PATH:/v1/image-generation}

pyan.base-url=${PYAN_BASE_URL:}
pyan.api-key=${PYAN_API_KEY:}
pyan.pen-mode=${PYAN_PEN_MODE:none}
pyan.output-autocrop=${PYAN_OUTPUT_AUTOCROP:true}
