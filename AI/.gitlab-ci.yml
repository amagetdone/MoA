stages:
  - test
  - build
  - deploy

variables:
  PIP_NO_CACHE_DIR: "1"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  IMAGE_NAME: $CI_REGISTRY_IMAGE

test:
  stage: test
  image: python:3.12.7-slim
  before_script:
    - python -m pip install --no-cache-dir uv
  script:
    - uv sync --frozen --extra dev
    - .venv/bin/python -m pytest -q
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev/ai"'
      when: always
    - when: never

docker-build:
  stage: build
  image: docker:27-cli
  services:
    - name: docker:27-dind
  needs:
    - test
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build --pull -t "$IMAGE_NAME:$IMAGE_TAG" -t "$IMAGE_NAME:latest" .
    - docker push "$IMAGE_NAME:$IMAGE_TAG"
    - docker push "$IMAGE_NAME:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev/ai"'
      when: always
    - when: never

deploy:
  stage: deploy
  image: alpine:3.21
  needs:
    - docker-build
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - printf "Host *\n  StrictHostKeyChecking no\n" > ~/.ssh/config
  script:
    - |
      ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
        "CI_REGISTRY='${CI_REGISTRY}' \
         CI_REGISTRY_USER='${CI_REGISTRY_USER}' \
         CI_REGISTRY_PASSWORD='${CI_REGISTRY_PASSWORD}' \
         CI_REGISTRY_IMAGE='${CI_REGISTRY_IMAGE}' \
         DEPLOY_CONTAINER_NAME='${DEPLOY_CONTAINER_NAME}' \
         DEPLOY_ENV_FILE='${DEPLOY_ENV_FILE}' \
         DEPLOY_PORT_MAP='${DEPLOY_PORT_MAP}' \
         IMAGE_TAG='${CI_COMMIT_SHORT_SHA}' \
         sh -s" <<'EOF'
      set -eu
      echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
      docker pull "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
      if docker ps -a --format '{{.Names}}' | grep -Eq "^${DEPLOY_CONTAINER_NAME}$"; then
        docker rm -f "$DEPLOY_CONTAINER_NAME"
      fi
      docker run -d \
        --name "$DEPLOY_CONTAINER_NAME" \
        --restart unless-stopped \
        --env-file "$DEPLOY_ENV_FILE" \
        -p "$DEPLOY_PORT_MAP" \
        "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
      EOF
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev/ai"'
      when: always
    - when: never
